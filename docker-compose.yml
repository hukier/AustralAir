version: "3.8"

services:
  # Base de datos exclusiva de Asientos
  db-asientos:
    image: postgres:15-alpine
    container_name: australair-db-asientos
    environment:
      POSTGRES_USER: ${ASIENTOS_DB_USER:?Falta ASIENTOS_DB_USER - copia .env.example a .env}
      POSTGRES_PASSWORD: ${ASIENTOS_DB_PASSWORD:?Falta ASIENTOS_DB_PASSWORD - copia .env.example a .env}
      POSTGRES_DB: ${ASIENTOS_DB_NAME:?Falta ASIENTOS_DB_NAME - copia .env.example a .env}
    volumes:
      - ./servicio-asientos/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - data-asientos:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ASIENTOS_DB_USER:?Falta ASIENTOS_DB_USER} -d ${ASIENTOS_DB_NAME:?Falta ASIENTOS_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-asientos

  # Microservicio gRPC Asientos
  servicio-asientos:
    build: ./servicio-asientos
    container_name: australair-asientos
    environment:
      DATABASE_URL: "postgresql://${ASIENTOS_DB_USER:?Falta ASIENTOS_DB_USER}:${ASIENTOS_DB_PASSWORD:?Falta ASIENTOS_DB_PASSWORD}@db-asientos:5432/${ASIENTOS_DB_NAME:?Falta ASIENTOS_DB_NAME}"
      PORT: 50051
    depends_on:
      db-asientos:
        condition: service_healthy
    networks:
      - red-asientos
      - red-interna-grpc

  # Base de datos exclusiva de Reservas
  db-reservas:
    image: postgres:15-alpine
    container_name: australair-db-reservas
    environment:
      POSTGRES_USER: ${RESERVAS_DB_USER:?Falta RESERVAS_DB_USER - copia .env.example a .env}
      POSTGRES_PASSWORD: ${RESERVAS_DB_PASSWORD:?Falta RESERVAS_DB_PASSWORD - copia .env.example a .env}
      POSTGRES_DB: ${RESERVAS_DB_NAME:?Falta RESERVAS_DB_NAME - copia .env.example a .env}
    volumes:
      - ./servicio-reservas/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - data-reservas:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${RESERVAS_DB_USER:?Falta RESERVAS_DB_USER} -d ${RESERVAS_DB_NAME:?Falta RESERVAS_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red-reservas

  # Microservicio REST Reservas (Puerta de entrada externa)
  servicio-reservas:
    build: ./servicio-reservas
    container_name: australair-reservas
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://${RESERVAS_DB_USER:?Falta RESERVAS_DB_USER}:${RESERVAS_DB_PASSWORD:?Falta RESERVAS_DB_PASSWORD}@db-reservas:5432/${RESERVAS_DB_NAME:?Falta RESERVAS_DB_NAME}"
      ASIENTOS_GRPC_HOST: "servicio-asientos:50051"
      API_KEY: ${API_KEY:?Falta API_KEY - copia .env.example a .env}
    depends_on:
      db-reservas:
        condition: service_healthy
      servicio-asientos:
        condition: service_started
    networks:
      - red-reservas
      - red-interna-grpc

volumes:
  data-asientos:
  data-reservas:

networks:
  red-asientos:
  red-reservas:
  red-interna-grpc:
