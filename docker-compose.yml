services:
  # -------------------------------------------------------------
  # Base de Datos: Asientos
  # -------------------------------------------------------------
  db-asientos:
    image: postgres:15-alpine
    container_name: australair-db-asientos
    environment:
      POSTGRES_USER: ${ASIENTOS_DB_USER:?Falta ASIENTOS_DB_USER - copia .env.example a .env}
      POSTGRES_PASSWORD: ${ASIENTOS_DB_PASSWORD:?Falta ASIENTOS_DB_PASSWORD}
      POSTGRES_DB: ${ASIENTOS_DB_NAME:?Falta ASIENTOS_DB_NAME}
    volumes:
      - ./servicio-asientos/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - datos-db-asientos:/var/lib/postgresql/data
    networks:
      - red-asientos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASIENTOS_DB_USER} -d ${ASIENTOS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------
  # Backend gRPC: Asientos
  # -------------------------------------------------------------
  servicio-asientos:
    build:
      context: .
      dockerfile: ./servicio-asientos/Dockerfile
    container_name: australair-asientos
    environment:
      DATABASE_URL: postgresql://${ASIENTOS_DB_USER}:${ASIENTOS_DB_PASSWORD}@db-asientos:5432/${ASIENTOS_DB_NAME}
      PORT: 50051
      LATENCIA_SIMULADA: ${LATENCIA_SIMULADA:-0.0}
    ports:
      - "50051:50051"
    depends_on:
      db-asientos:
        condition: service_healthy
    networks:
      - red-asientos
      - red-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50051), timeout=2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # -------------------------------------------------------------
  # Base de Datos: Reservas
  # -------------------------------------------------------------
  db-reservas:
    image: postgres:15-alpine
    container_name: australair-db-reservas
    environment:
      POSTGRES_USER: ${RESERVAS_DB_USER:?Falta RESERVAS_DB_USER - copia .env.example a .env}
      POSTGRES_PASSWORD: ${RESERVAS_DB_PASSWORD:?Falta RESERVAS_DB_PASSWORD}
      POSTGRES_DB: ${RESERVAS_DB_NAME:?Falta RESERVAS_DB_NAME}
    volumes:
      - ./servicio-reservas/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - datos-db-reservas:/var/lib/postgresql/data
    networks:
      - red-reservas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESERVAS_DB_USER} -d ${RESERVAS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------
  # API Gateway: Reservas
  # -------------------------------------------------------------
  servicio-reservas:
    build:
      context: .
      dockerfile: ./servicio-reservas/Dockerfile
    container_name: australair-reservas
    environment:
      DATABASE_URL: postgresql://${RESERVAS_DB_USER}:${RESERVAS_DB_PASSWORD}@db-reservas:5432/${RESERVAS_DB_NAME}
      ASIENTOS_GRPC_HOST: servicio-asientos:50051
      API_KEY: ${API_KEY:-secreto-australair-2026}
      API_KEY_LECTURA: ${API_KEY_LECTURA:-lectura-australair-2026}
    ports:
      - "8000:8000"
    depends_on:
      db-reservas:
        condition: service_healthy
      servicio-asientos:
        condition: service_healthy
    networks:
      - red-reservas
      - red-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 4s
    restart: unless-stopped

  # -------------------------------------------------------------
  # Base de Datos: Emisión
  # -------------------------------------------------------------
  db-emision:
    image: postgres:15-alpine
    container_name: australair-db-emision
    environment:
      POSTGRES_USER: ${EMISION_DB_USER:-usuario_emision}
      POSTGRES_PASSWORD: ${EMISION_DB_PASSWORD:-password_emision_segura}
      POSTGRES_DB: ${EMISION_DB_NAME:-australair_emision}
    volumes:
      - datos-db-emision:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMISION_DB_USER:-usuario_emision} -d ${EMISION_DB_NAME:-australair_emision}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - red-emision
    restart: unless-stopped

  # -------------------------------------------------------------
  # Microservicio: Emisión
  # -------------------------------------------------------------
  servicio-emision:
    build:
      context: .
      dockerfile: servicio-emision/Dockerfile
    container_name: australair-emision
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://${EMISION_DB_USER:-usuario_emision}:${EMISION_DB_PASSWORD:-password_emision_segura}@db-emision:5432/${EMISION_DB_NAME:-australair_emision}
      FALLA_SIMULADA_EMISION: "false"
    depends_on:
      db-emision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red-emision
      - red-saga
    restart: unless-stopped

  # -------------------------------------------------------------
  # Base de Datos: Saga
  # -------------------------------------------------------------
  db-saga:
    image: postgres:15-alpine
    container_name: australair-db-saga
    environment:
      POSTGRES_USER: ${SAGA_DB_USER:-usuario_saga}
      POSTGRES_PASSWORD: ${SAGA_DB_PASSWORD:-password_saga_segura}
      POSTGRES_DB: ${SAGA_DB_NAME:-australair_saga}
    volumes:
      - datos-db-saga:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SAGA_DB_USER:-usuario_saga} -d ${SAGA_DB_NAME:-australair_saga}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - red-saga
    restart: unless-stopped

  # -------------------------------------------------------------
  # Microservicio: Orquestador Saga
  # -------------------------------------------------------------
  servicio-saga:
    build:
      context: .
      dockerfile: servicio-saga/Dockerfile
    container_name: australair-saga
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://${SAGA_DB_USER:-usuario_saga}:${SAGA_DB_PASSWORD:-password_saga_segura}@db-saga:5432/${SAGA_DB_NAME:-australair_saga}
      GRPC_ASIENTOS_HOST: servicio-asientos:50051
      EMISION_URL: http://servicio-emision:8002
      PAGOS_URL: mock
    depends_on:
      db-saga:
        condition: service_healthy
      servicio-asientos:
        condition: service_healthy
      servicio-emision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 4s
    networks:
      - red-backend
      - red-asientos
      - red-emision
      - red-saga
    restart: unless-stopped

networks:
  red-backend:
    driver: bridge
  red-reservas:
    driver: bridge
  red-asientos:
    driver: bridge
  red-emision:
    driver: bridge
  red-saga:
    driver: bridge

volumes:
  datos-db-asientos:
  datos-db-reservas:
  datos-db-emision:
  datos-db-saga: