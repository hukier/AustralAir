openapi: 3.0.3
info:
  title: API Reservas - AustralAir
  description: >-
    API pública para gestión de pasajeros y emisión/cancelación de reservas de pasajes.
    Soporta autenticación con control de acceso basado en roles mediante cabecera X-API-Key
    (rol de Operación con permisos completos y rol de Lectura restringido a consultas GET).
  version: 1.0.0
servers:
  - url: http://localhost:8000/v1
    description: Servidor local de desarrollo

security:
  - ApiKeyAuth: []

paths:
  /pasajeros:
    post:
      summary: Crear pasajero
      description: Registra un nuevo pasajero validando unicidad y formato de RUT y correo electrónico. Requiere rol de Operación.
      tags: [Pasajeros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPasajeroRequest"
      responses:
        "201":
          description: Pasajero creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pasajero"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ErrorValidacion"

    get:
      summary: Listar pasajeros
      tags: [Pasajeros]
      responses:
        "200":
          description: Lista de pasajeros registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pasajero"
        "401":
          $ref: "#/components/responses/NoAutorizado"

  /pasajeros/{id}:
    get:
      summary: Obtener detalle de un pasajero
      tags: [Pasajeros]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle del pasajero solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pasajero"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorValidacion"

  /vuelos:
    get:
      summary: Consultar vuelos y disponibilidad
      description: Consulta federada que obtiene la disponibilidad en tiempo real desde el servicio de Asientos vía gRPC.
      tags: [Vuelos]
      responses:
        "200":
          description: Lista de vuelos obtenida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vuelo"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /reservas:
    post:
      summary: Crear una reserva de pasaje
      description: >-
        Valida el pasajero, reserva opcionalmente la clave de idempotencia asociada al hash SHA-256
        del cuerpo, descuenta atómicamente el cupo en Asientos vía gRPC y persiste la reserva con
        compensación automática ante fallos locales. Requiere rol de Operación.
      tags: [Reservas]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Clave idempotente opcional (UUID) para evitar reservas duplicadas ante reintentos.
            Si se reutiliza con un payload diferente, se rechaza con 409 Conflict.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearReservaRequest"
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Vuelo sin asientos disponibles o reutilización inválida de Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

    get:
      summary: Listar reservas
      tags: [Reservas]
      responses:
        "200":
          description: Lista de reservas registradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
        "401":
          $ref: "#/components/responses/NoAutorizado"

  /reservas/{id}:
    get:
      summary: Consultar una reserva por ID
      tags: [Reservas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle de la reserva solicitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorValidacion"

    delete:
      summary: Cancelar una reserva
      description: >-
        Transiciona atómicamente la reserva de CONFIRMADA a CANCELADA y restituye un asiento en
        Asientos vía gRPC únicamente en la primera transición efectiva (operación idempotente).
        Requiere rol de Operación.
      tags: [Reservas]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reserva cancelada (y asiento liberado si estaba CONFIRMADA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Clave de autenticación y autorización por rol:
        - Rol Operación (`API_KEY`, ej. `secreto-australair-2026`): acceso total (`GET`, `POST`, `DELETE`).
        - Rol Lectura (`API_KEY_LECTURA`, ej. `lectura-australair-2026`): acceso exclusivo a `GET`; retorna `403 Forbidden` en escrituras.

  responses:
    SolicitudInvalida:
      description: Solicitud con sintaxis JSON malformada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ErrorValidacion:
      description: Error de validación en parámetros, cabeceras o campos del cuerpo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutorizado:
      description: Falta API Key o es inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Prohibido:
      description: API Key válida pero sin permisos suficientes para esta operación (rol de solo lectura)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflicto:
      description: Conflicto de negocio (ej. pasajero duplicado, sin cupos disponibles o colisión de Idempotency-Key)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServicioNoDisponible:
      description: Falla o tiempo de espera agotado en la dependencia interna (Asientos gRPC)
      headers:
        Retry-After:
          description: Tiempo sugerido en segundos antes de reintentar la petición.
          schema:
            type: integer
            example: 5
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Pasajero:
      type: object
      required: [id, rut, nombre_completo, email]
      properties:
        id:
          type: string
          format: uuid
        rut:
          type: string
          pattern: '^\d{7,8}-[\dkK]$'
          example: "18945632-1"
        nombre_completo:
          type: string
          minLength: 2
          maxLength: 150
          example: "Camila Soto"
        email:
          type: string
          format: email
          maxLength: 150
          example: "camila.soto@email.com"

    CrearPasajeroRequest:
      type: object
      required: [rut, nombre_completo, email]
      properties:
        rut:
          type: string
          pattern: '^\d{7,8}-[\dkK]$'
          example: "18945632-1"
        nombre_completo:
          type: string
          minLength: 2
          maxLength: 150
          example: "Camila Soto"
        email:
          type: string
          format: email
          maxLength: 150
          example: "camila.soto@email.com"

    Vuelo:
      type: object
      required: [vuelo_id, codigo, origen, destino, capacidad_total, asientos_disponibles]
      properties:
        vuelo_id:
          type: string
        codigo:
          type: string
        origen:
          type: string
        destino:
          type: string
        capacidad_total:
          type: integer
        asientos_disponibles:
          type: integer

    Reserva:
      type: object
      required: [id, pasajero_id, vuelo_id, estado, creado_en]
      properties:
        id:
          type: string
          format: uuid
        pasajero_id:
          type: string
          format: uuid
        vuelo_id:
          type: string
          minLength: 1
          maxLength: 50
        estado:
          type: string
          enum: [CONFIRMADA, CANCELADA]
        creado_en:
          type: string
          format: date-time

    CrearReservaRequest:
      type: object
      required: [pasajero_id, vuelo_id]
      properties:
        pasajero_id:
          type: string
          format: uuid
        vuelo_id:
          type: string
          minLength: 1
          maxLength: 50

    Error:
      type: object
      required: [codigo, detalle, timestamp]
      properties:
        codigo:
          type: string
          enum:
            - PASAJERO_NO_ENCONTRADO
            - PASAJERO_YA_EXISTE
            - RESERVA_NO_ENCONTRADA
            - VUELO_NO_ENCONTRADO
            - ASIENTOS_INDISPONIBLES
            - SERVICIO_NO_DISPONIBLE
            - VALIDACION
            - NO_AUTORIZADO
            - PROHIBIDO
            - CONFLICTO_IDEMPOTENCIA
            - ERROR_INTERNO
          example: "ASIENTOS_INDISPONIBLES"
        detalle:
          type: string
          description: Mensaje descriptivo del error.
          example: "No hay asientos disponibles para el vuelo solicitado."
        timestamp:
          type: string
          format: date-time
          description: Marca temporal UTC en formato ISO 8601 en que ocurrió el error.
          example: "2026-10-30T14:30:00Z"
